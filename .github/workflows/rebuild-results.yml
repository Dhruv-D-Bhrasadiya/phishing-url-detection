name: Rebuild phishing detection results

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/rebuild-results.yml"
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: write

concurrency:
  group: phishing-results
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; else echo 'No tests/ directory; running the smoke test below.'; fi
      - name: Run synthetic smoke test
        run: python -m src.experiments --quick-check
      - name: Upload smoke-test outputs
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            results/metrics/**
            results/figures/**
          if-no-files-found: error
          retention-days: 14

  full-experiments:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run experiments
        run: |
          python -m src.experiments             --d1 data/raw/dataset_phishing_uci.csv             --d2 data/raw/phiusiil_phishing_url.csv             --d1-sample 5000             --d2-sample 10000             --no-tune             --skip-bonus
      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figures results/metrics
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "chore(results): refresh experiment outputs"
          git push
